<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis gastos</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231e;--mute:#62736c;--line:#dbe3df;--in:#0f7a4f;--out:#c2410c;--brand:#14463a;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#18251f;--ink:#e8f0ec;--mute:#93a69d;--line:#2a3a33;--in:#4fd19b;--out:#ff9a62;--brand:#4fd19b;--onbrand:#0f1815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#18251f;--ink:#e8f0ec;--mute:#93a69d;--line:#2a3a33;--in:#4fd19b;--out:#ff9a62;--brand:#4fd19b;--onbrand:#0f1815;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;font-weight:800;margin:4px 0 12px}
.mes{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mes button{width:44px;height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:20px}
.mes strong{font-size:18px;text-transform:capitalize}
.bal{background:var(--brand);color:var(--onbrand);border-radius:20px;padding:18px}
.bal small{opacity:.8;display:block}
.bal .n{font-size:34px;font-weight:800;letter-spacing:-.5px}
.ant{margin-top:6px;font-size:14px;opacity:.9}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dos div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.dos b{display:block;font-size:18px}
section{margin-top:20px}
h2{font-size:16px;font-weight:600;margin:0 0 8px;color:var(--mute)}
.barra{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.barra i{display:block;height:10px;border-radius:5px;background:var(--out)}
.dia{font-weight:600;color:var(--mute);font-size:14px;margin:16px 0 6px;text-transform:capitalize}
.mov{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mov .t{flex:1;min-width:0}
.mov .t b{display:block}
.mov .t span{color:var(--mute);font-size:13px}
.mov .m{font-weight:800;white-space:nowrap}
.m.i{color:var(--in)}.m.e{color:var(--out)}
.mov button{border:0;background:none;color:var(--mute);font-size:18px;width:36px;height:36px}
.vacio{color:var(--mute);text-align:center;padding:28px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border:0;border-radius:28px;background:var(--brand);color:var(--onbrand);font:800 16px Figtree,system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25)}
dialog{width:min(520px,100% - 24px);border:0;border-radius:22px;padding:18px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink)}
.tipo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipo button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px Figtree,system-ui,sans-serif}
.tipo button.on.e{background:var(--out);color:#fff;border-color:var(--out)}
.tipo button.on.i{background:var(--in);color:#fff;border-color:var(--in)}
.acc{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:18px}
.acc button{height:48px;border-radius:12px;border:0;font:800 16px Figtree,system-ui,sans-serif}
.acc .c{background:var(--bg);color:var(--ink)}.acc .g{background:var(--brand);color:var(--onbrand)}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.aviso{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;color:var(--mute)}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.filtros #fq{grid-column:1/-1}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--mute);text-align:center}
.pager button,.resp button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Figtree,system-ui,sans-serif}
.pager button:disabled{opacity:.4}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.resp #pdf{grid-column:1/-1;background:var(--brand);color:var(--onbrand);border:0}
#ext{display:none}
@page{size:A4;margin:14mm}
@media print{body>*:not(#ext){display:none!important}body{background:#fff}:root{padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#ext{display:block;color:#14231e;background:#fff;font:11px/1.45 Figtree,system-ui,sans-serif}
#ext .cab{background:#14463a;color:#fff;border-radius:10px;padding:16px 18px}
#ext .cab h1{font-size:22px;margin:0}
#ext .cab div{opacity:.85;margin-top:2px}
#ext .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
#ext .res div{border:1px solid #cfd9d4;border-radius:10px;padding:10px 12px}
#ext .res small{display:block;color:#62736c}
#ext .res b{font-size:16px}
#ext .i{color:#0f7a4f}#ext .e{color:#c2410c}
#ext h2{font-size:13px;margin:14px 0 6px}
#ext table{width:100%;border-collapse:collapse}
#ext thead{display:table-header-group}
#ext th{background:#e8efeb;text-align:left;padding:6px;font-weight:600}
#ext td{padding:6px;border-bottom:1px solid #dbe3df;vertical-align:top}
#ext tr{break-inside:avoid}
#ext tbody tr:nth-child(even) td{background:#f5f8f6}
#ext .r{text-align:right;white-space:nowrap}
#ext .pie{margin-top:12px;color:#62736c;font-size:10px}}
</style>
</head>
<body>
<main>
<h1>Mis gastos</h1>
<div id="aviso" class="aviso" hidden>Este navegador no permite guardar datos. Lo que registres se perderá al cerrar la página.</div>
<div class="mes"><button id="ant" aria-label="Mes anterior">‹</button><strong id="mesTxt"></strong><button id="sig" aria-label="Mes siguiente">›</button></div>
<div class="bal">
<small>Saldo disponible</small><div class="n" id="bal"></div><div class="ant" id="antw">Saldo del mes anterior: <b id="tprev"></b></div>
<div class="dos"><div><small>Ingresos</small><b id="tin"></b></div><div><small>Gastos</small><b id="tout"></b></div></div>
</div>
<section id="resumen" hidden><h2>En qué se fue la plata</h2><div id="cats"></div></section>
<section><h2>Movimientos</h2>
<div class="filtros">
<input id="fq" type="search" placeholder="Buscar por nota, categoría o monto" aria-label="Buscar">
<select id="fp" aria-label="Periodo"><option value="mes">Este mes</option><option value="todo">Todo el historial</option></select>
<select id="ft" aria-label="Tipo"><option value="">Ingresos y gastos</option><option value="i">Solo ingresos</option><option value="e">Solo gastos</option></select>
<select id="fc" aria-label="Categoría"></select>
<select id="fm" aria-label="Medio"></select>
</div>
<div id="lista"></div>
<div class="pager" id="pager" hidden><button id="pa">‹ Anterior</button><span id="pg"></span><button id="ps">Siguiente ›</button></div>
</section>
<section><h2>Extracto y respaldo</h2><div class="resp"><button id="pdf">Descargar extracto en PDF</button><button id="exp">Exportar respaldo</button><button id="impb">Importar respaldo</button><input id="imp" type="file" accept=".json,application/json" hidden></div></section>
</main>
<button class="fab" id="nuevo">+ Agregar</button>

<dialog id="dlg">
<div class="tipo"><button type="button" id="bE" class="on e">Gasto</button><button type="button" id="bI" class="i">Ingreso</button></div>
<label for="monto">Monto (COP)</label><input id="monto" inputmode="numeric" placeholder="25.000" autocomplete="off">
<label for="cat">Categoría</label><select id="cat"></select>
<div id="cOtro" hidden><label for="cTxt">¿Cuál categoría?</label><input id="cTxt" placeholder="Escribe la categoría" autocomplete="off"></div>
<div id="pPer" hidden><label for="per" id="perL">¿A quién?</label><input id="per" placeholder="Nombre de la persona" autocomplete="off"></div>
<label for="medio">Medio</label><select id="medio"></select>
<div id="mOtro" hidden><label for="mTxt">¿Cuál banco o medio?</label><input id="mTxt" placeholder="Escribe el nombre" autocomplete="off"></div>
<label for="fecha">Fecha</label><input id="fecha" type="date">
<label for="nota">Nota (opcional)</label><input id="nota" placeholder="Ej: almuerzo con Juan" autocomplete="off">
<div class="acc"><button type="button" class="c" id="cancel">Cancelar</button><button type="button" class="g" id="guardar">Guardar</button></div>
</dialog>

<div id="ext"></div>
<script>
var CATS={e:["Comida","Mercado","Arriendo","Servicios","Transporte","Suscripciones","Ocio","Salud","Ropa","Deudas","Préstamos","Otros"],i:["Nómina","Transferencia recibida","Venta","Préstamos","Otros ingresos"]};
var MEDIOS=["Efectivo","Bancolombia","Nequi","Transferencia","Tarjeta de crédito","Tarjeta débito","Otro banco"];
var KEY="mis-gastos-v1",datos=[],ULT=[],PREV=0,pag=1,tipo="e",ver=new Date();ver.setDate(1);
function cargar(){try{var r=localStorage.getItem(KEY);datos=r?JSON.parse(r):[]}catch(e){datos=[];document.getElementById("aviso").hidden=false}}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(datos))}catch(e){document.getElementById("aviso").hidden=false}}
var $=function(i){return document.getElementById(i)};
var cop=new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
function hoy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pintar(){llenarFiltros();
  var p=ver.getFullYear()+"-"+String(ver.getMonth()+1).padStart(2,"0");
  $("mesTxt").textContent=ver.toLocaleDateString("es-CO",{month:"long",year:"numeric"});
  var q=$("fq").value.trim().toLowerCase(),ft=$("ft").value,fc=$("fc").value,fm=$("fm").value,fp=$("fp").value;
  if(fp==="todo")$("mesTxt").textContent="Todo el historial";
  var pasa=function(x){
    if(ft&&x.tipo!==ft)return false;if(fc&&x.cat!==fc)return false;if(fm&&x.medio!==fm)return false;
    if(q&&(x.cat+" "+x.medio+" "+x.nota+" "+(x.persona||"")+" "+x.monto).toLowerCase().indexOf(q)<0)return false;
    return true};
  var m=datos.filter(function(x){return pasa(x)&&(fp!=="mes"||x.fecha.slice(0,7)===p)}).sort(function(a,b){return b.fecha.localeCompare(a.fecha)||b.id-a.id});
  var prev=0;if(fp==="mes")datos.forEach(function(x){if(pasa(x)&&x.fecha.slice(0,7)<p)prev+=x.tipo==="i"?x.monto:-x.monto});
  var ti=0,to=0,por={};
  m.forEach(function(x){if(x.tipo==="i")ti+=x.monto;else{to+=x.monto;por[x.cat]=(por[x.cat]||0)+x.monto}});
  $("bal").textContent=cop.format(prev+ti-to);$("tprev").textContent=cop.format(prev);$("antw").hidden=fp!=="mes";$("tin").textContent=cop.format(ti);$("tout").textContent=cop.format(to);
  var ks=Object.keys(por).sort(function(a,b){return por[b]-por[a]}),mx=ks.length?por[ks[0]]:1;
  $("resumen").hidden=!ks.length;
  $("cats").innerHTML=ks.map(function(k){return '<div class="barra"><span>'+esc(k)+'</span><i style="width:'+Math.max(4,por[k]/mx*100)+'%"></i><span>'+cop.format(por[k])+'</span></div>'}).join("");
  ULT=m;PREV=prev;var pags=Math.max(1,Math.ceil(m.length/15));if(pag>pags)pag=pags;
  var vis=m.slice((pag-1)*15,pag*15);
  $("pager").hidden=pags<2;$("pg").textContent="Página "+pag+" de "+pags+" · "+m.length+" movimientos";
  $("pa").disabled=pag<=1;$("ps").disabled=pag>=pags;
  if(!m.length){$("lista").innerHTML='<div class="vacio">No hay movimientos para mostrar.<br>Cambia los filtros o toca «Agregar».</div>';return}
  var h="",ult="";
  vis.forEach(function(x){
    if(x.fecha!==ult){ult=x.fecha;var d=new Date(x.fecha+"T12:00:00");h+='<div class="dia">'+d.toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})+'</div>'}
    h+='<div class="mov"><div class="t"><b>'+esc(x.cat)+'</b><span>'+esc(x.medio)+(x.persona?" · "+(x.tipo==="e"?"a ":"de ")+esc(x.persona):"")+(x.nota?" · "+esc(x.nota):"")+'</span></div><div class="m '+x.tipo+'">'+(x.tipo==="i"?"+":"−")+cop.format(x.monto)+'</div><button data-id="'+x.id+'" aria-label="Borrar">✕</button></div>'
  });
  $("lista").innerHTML=h;
}
function opciones(){
  $("cat").innerHTML=CATS[tipo].map(function(c){return "<option>"+c+"</option>"}).join("");
  $("bE").className="e"+(tipo==="e"?" on":"");$("bI").className="i"+(tipo==="i"?" on":"");campos();
}
$("medio").innerHTML=MEDIOS.map(function(c){return "<option>"+c+"</option>"}).join("");
$("bE").onclick=function(){tipo="e";opciones()};
$("bI").onclick=function(){tipo="i";opciones()};
$("nuevo").onclick=function(){tipo="e";opciones();$("monto").value="";$("nota").value="";$("cTxt").value="";$("per").value="";$("mTxt").value="";campos();$("fecha").value=hoy();$("dlg").showModal();$("monto").focus()};
$("cancel").onclick=function(){$("dlg").close()};
$("monto").oninput=function(){var n=this.value.replace(/\D/g,"");this.value=n?Number(n).toLocaleString("es-CO"):""};
$("guardar").onclick=function(){
  var n=parseInt($("monto").value.replace(/\D/g,""),10);
  if(!n){$("monto").focus();return}
  var cat=$("cat").value,med=$("medio").value,per=$("per").value.trim();
  if(cat==="Préstamos"&&!per){$("per").focus();return}
  if(/^Otros/.test(cat)&&$("cTxt").value.trim())cat=$("cTxt").value.trim();
  if(med==="Otro banco"&&$("mTxt").value.trim())med=$("mTxt").value.trim();
  var reg={id:Date.now(),tipo:tipo,monto:n,cat:cat,medio:med,fecha:$("fecha").value||hoy(),nota:$("nota").value.trim()};
  if(cat==="Préstamos")reg.persona=per;
  datos.push(reg);
  guardar();$("dlg").close();
  var f=($("fecha").value||hoy()).split("-");ver=new Date(+f[0],+f[1]-1,1);pag=1;pintar();
};
$("lista").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(confirm("¿Borrar este movimiento?")){datos=datos.filter(function(x){return String(x.id)!==b.dataset.id});guardar();pintar()}};
$("ant").onclick=function(){ver.setMonth(ver.getMonth()-1);pag=1;pintar()};
$("sig").onclick=function(){ver.setMonth(ver.getMonth()+1);pag=1;pintar()};
function op(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>'}
function campos(){var c=$("cat").value;$("cOtro").hidden=!/^Otros/.test(c);$("pPer").hidden=c!=="Préstamos";$("perL").textContent=tipo==="e"?"¿A quién le prestaste?":"¿Quién te prestó o te pagó?";$("mOtro").hidden=$("medio").value!=="Otro banco"}
function llenarFiltros(){var c=$("fc").value,md=$("fm").value,cs=[],ms=MEDIOS.slice();
  CATS.e.concat(CATS.i).forEach(function(v){if(cs.indexOf(v)<0)cs.push(v)});
  datos.forEach(function(x){if(cs.indexOf(x.cat)<0)cs.push(x.cat);if(ms.indexOf(x.medio)<0)ms.push(x.medio)});
  $("fc").innerHTML='<option value="">Todas las categorías</option>'+cs.map(op).join("");
  $("fm").innerHTML='<option value="">Todos los medios</option>'+ms.map(op).join("");
  $("fc").value=c;$("fm").value=md}
$("cat").onchange=campos;$("medio").onchange=campos;
$("pdf").onclick=function(){
  if(!ULT.length){alert("No hay movimientos para el extracto.");return}
  var a=ULT.slice().reverse(),ti=0,to=0,por={},fe=function(s){return s.split("-").reverse().join("/")};
  var filas=a.map(function(x){
    if(x.tipo==="i")ti+=x.monto;else{to+=x.monto;por[x.cat]=(por[x.cat]||0)+x.monto}
    var det=(x.persona?(x.tipo==="e"?"Préstamo a ":"Préstamo de ")+esc(x.persona):"")+(x.nota?(x.persona?" · ":"")+esc(x.nota):"");
    return "<tr><td>"+fe(x.fecha)+"</td><td>"+esc(x.cat)+"</td><td>"+esc(x.medio)+"</td><td>"+det+"</td><td class='r i'>"+(x.tipo==="i"?cop.format(x.monto):"")+"</td><td class='r e'>"+(x.tipo==="e"?cop.format(x.monto):"")+"</td></tr>"}).join("");
  var ks=Object.keys(por).sort(function(u,v){return por[v]-por[u]});
  var cats=ks.length?"<h2>Gastos por categoría</h2><table><tbody>"+ks.map(function(k){return "<tr><td>"+esc(k)+"</td><td class='r'>"+Math.round(por[k]/to*100)+"%</td><td class='r e'>"+cop.format(por[k])+"</td></tr>"}).join("")+"</tbody></table>":"";
  var fl=$("fq").value||$("ft").value||$("fc").value||$("fm").value,mes=$("fp").value==="mes",pv=mes?PREV:0,bal=pv+ti-to;
  $("ext").innerHTML="<div class='cab'><h1>Extracto · "+esc($("mesTxt").textContent)+"</h1><div>"+a.length+" movimientos"+(fl?" · con filtros aplicados":"")+"</div></div>"
   +"<div class='res'>"+(mes?"<div><small>Saldo anterior</small><b>"+cop.format(pv)+"</b></div>":"")+"<div><small>Ingresos</small><b class='i'>"+cop.format(ti)+"</b></div><div><small>Gastos</small><b class='e'>"+cop.format(to)+"</b></div><div><small>Saldo final</small><b class='"+(bal<0?"e":"i")+"'>"+cop.format(bal)+"</b></div></div>"
   +cats+"<h2>Detalle de movimientos</h2><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Medio</th><th>Detalle</th><th class='r'>Ingreso</th><th class='r'>Gasto</th></tr></thead><tbody>"+filas+"</tbody></table>"
   +"<div class='pie'>Generado el "+fe(hoy())+" · Mis gastos</div>";
  window.print()};
["fq","fp","ft","fc","fm"].forEach(function(i){$(i).oninput=function(){pag=1;pintar()}});
$("pa").onclick=function(){pag--;pintar();window.scrollTo(0,0)};
$("ps").onclick=function(){pag++;pintar();window.scrollTo(0,0)};
$("exp").onclick=function(){var b=new Blob([JSON.stringify(datos)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="respaldo-gastos-"+hoy()+".json";document.body.appendChild(a);a.click();a.remove()};
$("impb").onclick=function(){$("imp").click()};
$("imp").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var n=JSON.parse(r.result);if(!Array.isArray(n))throw 0;var ids={};datos.forEach(function(x){ids[x.id]=1});var add=n.filter(function(x){return x&&x.id&&x.fecha&&x.monto&&!ids[x.id]});datos=datos.concat(add);guardar();pag=1;pintar();alert("Se importaron "+add.length+" movimientos.")}catch(e){alert("El archivo no es un respaldo válido.")}};r.readAsText(f);this.value=""};
cargar();opciones();pintar();
</script>
</body>
</html>
